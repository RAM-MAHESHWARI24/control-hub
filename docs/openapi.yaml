openapi: 3.1.0
info:
  title: Control Hub Dashboard API
  description: >
    High-performance, ultra-lean management daemon and REST API engine for homelab clusters.
    Engineered for ultra-low resource footprints (<25MB RAM, <1% idle CPU).
  version: 2.1.1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:7575
    description: Localhost daemon binding
  - url: http://{server_ip}:7575
    description: Host LAN address
    variables:
      server_ip:
        default: 192.168.1.100
        description: LAN IP of the target homelab server

# Every route except the public probes (/api/health, /api/livez, /api/readyz,
# /api/docs, /api/openapi.yaml) and /api/auth/login + /api/auth/status needs
# either the `hub_session` cookie (set by POST /api/auth/login with the dashboard
# password) or `Authorization: Bearer <token>`. The token lives in
# /etc/homelab/control-hub.token (shown by `./setup.sh token`) and is meant for
# scripts. Whoever signs in controls a daemon that is root-equivalent on the host.
security:
  - bearerToken: []

paths:
  /api/health:
    get:
      security: []
      summary: Service Health Check
      description: Returns overall operational health status of the Control Hub daemon.
      tags: [Observability]
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "control-hub" }
                  version: { type: string, example: "2.1.1" }
                  uptime_seconds: { type: number, example: 342.1 }

  /api/livez:
    get:
      security: []
      summary: Liveness Probe
      description: Kubernetes-style liveness probe. Fast check to confirm the event loop is active.
      tags: [Observability]
      responses:
        '200':
          description: Event loop is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "live" }

  /api/readyz:
    get:
      security: []
      summary: Readiness Probe
      description: Kubernetes-style readiness probe. Verifies downstream storage and telemetry subsystems.
      tags: [Observability]
      responses:
        '200':
          description: All critical subsystems are initialized and responsive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
                  checks:
                    type: object
                    properties:
                      telemetry: { type: string, example: "ok" }
                      storage: { type: string, example: "ok" }
        '503':
          description: One or more critical subsystems are failing

  /api/system/vitals:
    get:
      summary: System Vitals & Hardware Telemetry
      description: Returns live CPU utilization, physical memory breakdown, core temperatures, and thermal headroom.
      tags: [Telemetry]
      responses:
        '200':
          description: System vitals payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpu_percent: { type: number, example: 4.2 }
                  ram_used_gib: { type: number, example: 2.1 }
                  ram_total_gib: { type: number, example: 7.9 }
                  ram_percent: { type: number, example: 26.5 }
                  temp_celsius: { type: number, example: 42.0 }

  /api/network/speed:
    get:
      summary: Real-Time Network Throughput
      description: Returns instantaneous download and upload transfer rates sampled from the physical NIC.
      tags: [Network]
      responses:
        '200':
          description: Instantaneous network speeds
          content:
            application/json:
              schema:
                type: object
                properties:
                  rx_mbps: { type: number, example: 12.4 }
                  tx_mbps: { type: number, example: 1.8 }
                  link_speed_mbps: { type: integer, example: 1000 }
                  active_nic: { type: string, example: "eth0" }

  /api/speedtest/latest:
    get:
      summary: Latest WAN Speedtest Results
      description: Retrieves the most recent scheduled Ookla speedtest report.
      tags: [Network]
      responses:
        '200':
          description: Speedtest metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_mbps: { type: number, example: 284.5 }
                  upload_mbps: { type: number, example: 48.2 }
                  ping_ms: { type: number, example: 12.1 }
                  timestamp: { type: string, example: "2026-10-31T04:00:00Z" }

  /api/speedtest/run:
    post:
      summary: Trigger On-Demand Speedtest
      description: Initiates an asynchronous background WAN speed measurement.
      tags: [Network]
      responses:
        '202':
          description: Speedtest initiated

  /api/downloads/active:
    get:
      summary: Active Torrent Telemetry
      description: Returns real-time download and upload transfer rates and active torrent counts from qBittorrent.
      tags: [Media Ingest]
      responses:
        '200':
          description: Active torrent stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean, example: true }
                  download_rate_mbps: { type: number, example: 8.4 }
                  upload_rate_mbps: { type: number, example: 0.5 }
                  active_torrents: { type: integer, example: 3 }
                  paused: { type: boolean, example: false }

  /api/torrents/toggle-all:
    post:
      summary: Pause or Resume All Torrents
      description: Toggles the execution state of the entire torrent download queue.
      tags: [Media Ingest]
      responses:
        '200':
          description: Toggle state updated

  /api/torrents/{torrent_hash}/action:
    post:
      summary: Per-torrent queue action
      description: Pause, resume, delete (optional delete_files), or change priority for one torrent.
      tags: [Media Ingest]
      responses:
        '200':
          description: "{success, hash, action}"

  /api/torrents/limits:
    get:
      summary: Read qBittorrent global and alternative speed limits
      tags: [Media Ingest]
      responses:
        '200':
          description: "{success, dl_limit_kbps, up_limit_kbps, alt_speed_enabled, scheduler_enabled}"
    post:
      summary: Update qBittorrent global caps, toggle alt-speed mode, or configure evening schedule
      tags: [Media Ingest]
      responses:
        '200':
          description: "{success: true}"

  /api/storage/operations:
    get:
      summary: Storage Mount Capacities
      description: Returns capacity, utilized space, free space, and mount paths for SSD root and HDD pools.
      tags: [Storage]
      responses:
        '200':
          description: Storage filesystem metrics

  /api/services/status:
    get:
      summary: Docker Container Service Matrix
      description: Returns running status, health check status, and 12-char hex container IDs for all stack services.
      tags: [Cluster Management]
      responses:
        '200':
          description: Container status matrix

  /api/services/action/{service_id}:
    post:
      summary: Start, Stop, or Restart a Container Service
      description: Executes `docker start`, `docker stop`, or `docker restart` on a catalog or existing Docker container.
      tags: [Cluster Management]
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string }
          example: "jellyfin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart] }
      responses:
        '200':
          description: Action completed
        '400':
          description: Invalid action or container name
        '404':
          description: Container not found

  /api/services/restart/{service_id}:
    post:
      summary: Restart Container Service
      description: Triggers a graceful restart of the specified Docker container.
      tags: [Cluster Management]
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string }
          example: "jellyfin"
      responses:
        '200':
          description: Restart initiated

  /api/services/logs/{service_id}:
    get:
      summary: Tail Service Logs
      description: Returns the latest log lines for the specified service.
      tags: [Cluster Management]
      parameters:
        - name: service_id
          in: path
          required: true
          schema: { type: string }
          example: "sonarr"
      responses:
        '200':
          description: Log stream lines

  /api/sleep/status:
    get:
      summary: Sleep Guard Power Automation Status
      description: Returns current ACPI S3 sleep window, active lock reasons (plex/immich/downloads), and tonight's sleep status.
      tags: [Power Automation]
      responses:
        '200':
          description: Sleep guard state

  /api/sleep/toggle:
    post:
      summary: Toggle Sleep Guard Automation
      description: Enables or disables automated nightly ACPI S3 sleep.
      tags: [Power Automation]
      responses:
        '200':
          description: State toggled

  /api/sleep/shift-tonight:
    post:
      summary: Shift Tonight's Sleep Window
      description: Adjusts tonight's sleep start or wakeup time without altering permanent cron configuration.
      tags: [Power Automation]
      responses:
        '200':
          description: Tonight's schedule updated

  /api/sleep/schedule-permanent:
    post:
      summary: Update Permanent Nightly Sleep Schedule
      description: Updates `/etc/server-suspend.conf` and `/etc/cron.d/server-suspend` (including enabling/disabling nightly sleep).
      tags: [Power Automation]
      responses:
        '200':
          description: Permanent schedule updated

  /api/backup/status:
    get:
      summary: Google Drive Cloud Backup Status
      description: >-
        Photo backup state read from the status.json the backup script writes. `health`
        holds the computed state (unknown, syncing, synced, error, interrupted or stale:
        no good run for more than BACKUP_STALE_HOURS, default 26), `is_red`, the last good
        run and its age, the next run from /etc/cron.d/immich-backup, the pre-flight checks
        of the last run, the last 7 runs, transfer totals and retention (kept, deleted by
        the last run, deleted by the next run). Values that cannot be read are null.
      tags: [Backup]
      responses:
        '200':
          description: Backup execution telemetry

  /api/backup/remotes:
    get:
      summary: rclone remotes available for the backups
      description: >-
        Remotes in root's rclone config (name and type) and the remote the backups use now,
        read through the blueprint's root helper homelab-backup-remote. 404 on installs
        without the helper.
      tags: [Backup]
      responses:
        '200':
          description: "{remotes: [{name, type}], current}"
        '404':
          description: Not available on this install

  /api/backup/remote/test:
    post:
      summary: Test a backup remote
      description: >-
        `remote` is `name:` or `name:folder/`. The helper checks the value strictly, that the
        remote exists in root's rclone config and answers, its free space, and which backup
        folders already exist (Memories, Immich_Backup/database, Media_Backup). Nothing is changed.
      tags: [Backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remote]
              properties:
                remote: { type: string, example: "gdrive:homelab/" }
      responses:
        '200':
          description: "{ok, remote, error, free_bytes, total_bytes, folders}"

  /api/backup/remote:
    put:
      summary: Switch both backups to another remote
      description: >-
        Tests the remote again, then rewrites GDRIVE_REMOTE in /etc/cron.d/immich-backup and
        /etc/cron.d/media-backup, /etc/homelab/control-hub.env and homelab.env, and gdrive_remote
        in /etc/homelab/config.json. Takes effect from the next backup run.
      tags: [Backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remote]
              properties:
                remote: { type: string, example: "gdrive:homelab/" }
      responses:
        '200':
          description: "{ok, remote, changed, test} or {ok: false, error}"

  /api/backup/restore-test:
    post:
      summary: Run the photo backup restore test now
      description: >-
        Asks systemd to start photo-restore-test.service (through a fixed sudoers entry), which
        restores the newest remote dump into a throwaway database and records the result in
        status.json. /api/backup/status reports `restore` ({installed, running, next}) and the last
        result under `health.restore_test`.
      tags: [Backup]
      responses:
        '200':
          description: "{success, message}; success is false when a test is already running"
        '404':
          description: The restore test is not installed

  /api/backup/media/run:
    post:
      summary: Back up the media apps' settings now
      description: >-
        Starts the media module's settings backup (it moves itself into its own systemd unit).
        Its state appears under `media` in /api/backup/status: the same health fields as the
        photo backup plus `archive`, `archive_size` and `can_run`; `media` is null when the
        backup is not installed.
      tags: [Backup]
      responses:
        '200':
          description: "{success, message}; success is false when a run is already in progress"
        '404':
          description: Not installed (MEDIA_BACKUP_SCRIPT is not set)

  /api/backup/sync:
    post:
      summary: Trigger On-Demand Cloud Backup
      description: Initiates an immediate cloud synchronization sweep with trash buffering.
      tags: [Backup]
      responses:
        '202':
          description: Backup job started

  /api/cron/status:
    get:
      summary: Cron & Automation Task Timers
      description: Returns next execution schedules and historical statuses for all scheduled homelab tasks.
      tags: [Automation]
      responses:
        '200':
          description: Cron status overview

  /api/tv-updater/status:
    get:
      summary: Android TV Updater Fleet Status
      description: >-
        Returns each TV's address, connection state, installed app versions and available
        updates. `name` is the user's nickname, else the model the TV reported (for example
        "Xiaomi MIBOX4"), else the profile name; `model`/`model_label` are null until the TV
        has been online once. `details` holds manufacturer, model, codename, Android version,
        the TV's own device name and when it was last seen. Versions of an offline TV come
        from when it was last seen and say so.
      tags: [Fleet Management]
      responses:
        '200':
          description: TV fleet status

  /api/tv-updater/devices/{device_id}/nickname:
    put:
      summary: Give a TV a nickname
      description: >-
        Stores a name of the user's choice (at most 40 characters, whitespace collapsed) in
        nicknames.json in the TV auto-updater's state directory. An empty name removes it, and
        the dashboard shows the detected model again.
      tags: [Fleet Management]
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, example: living_room_tv }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 40, example: Living room }
      responses:
        '200':
          description: "{success, device_id, nickname}"

  /api/tv-updater/scan-lan:
    post:
      summary: Scan LAN subnet for TVs with ADB network port open
      tags: [Fleet Management]
      responses:
        '200':
          description: "{success, candidates}"

  /api/tv-updater/connect:
    post:
      summary: Connect to an ADB TV endpoint and read model & Android version
      tags: [Fleet Management]
      responses:
        '200':
          description: "{success, connected, needs_auth, suggested_name, apps, message}"

  /api/tv-updater/devices:
    post:
      summary: Add a new managed Android TV profile
      tags: [Fleet Management]
      responses:
        '201':
          description: "{success, device}"

  /api/tv-updater/devices/{device_id}:
    patch:
      summary: Update TV name, IP/port, paused state, or app selection
      tags: [Fleet Management]
      responses:
        '200':
          description: "{success, device}"
    delete:
      summary: Remove a TV profile from the fleet
      tags: [Fleet Management]
      responses:
        '200':
          description: "{success, removed}"

  /api/tv-updater/devices/{device_id}/test:
    post:
      summary: Test ADB connectivity to a configured TV
      tags: [Fleet Management]
      responses:
        '200':
          description: "{success, connected, needs_auth, message}"
        '400':
          description: Name too long or contains control characters
        '404':
          description: Unknown TV, or the TV module is not installed

  /api/config/current:
    get:
      summary: Current Configuration Settings
      description: Returns active configuration key-value mappings (sanitizing sensitive master passwords).
      tags: [Configuration]
      responses:
        '200':
          description: Configuration settings

  /api/config/update:
    post:
      summary: Update Configuration Settings
      description: >
        Re-renders the module env files from the submitted configuration. On a blueprint
        install /etc/homelab is root-owned, so this returns 403 with instructions to edit
        /etc/homelab/config.json and re-run `sudo ./setup.sh --headless --config ...`.
      tags: [Configuration]
      responses:
        '200':
          description: Configuration updated
        '403':
          description: Environment directory is root-owned; apply the change through setup.sh

  /api/auth/login:
    post:
      summary: Sign in with the dashboard password
      description: Sets the HttpOnly `hub_session` cookie (SameSite=Strict, about 400 days). The API token is also accepted as the password. 10 wrong attempts in 5 minutes from one address answer 429.
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { password: { type: string } } }
      responses:
        '200': { description: Signed in; cookie set }
        '401': { description: Wrong password }
        '409': { description: No dashboard password set (run `sudo ./setup.sh password`) }
        '429': { description: Too many wrong attempts }
  /api/auth/status:
    get:
      summary: Whether this request is signed in and whether a password is set
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { type: object, properties: { authenticated: { type: boolean }, password_set: { type: boolean } } }
  /api/auth/logout:
    post:
      summary: Sign this browser out (clears the cookie)
      tags: [Auth]
      responses:
        '200': { description: Signed out }
  /api/auth/password:
    post:
      summary: Change the dashboard password
      description: Needs the current password. Signs out every other browser; this one stays signed in.
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { current: { type: string }, new: { type: string, minLength: 8 } } }
      responses:
        '200': { description: Changed }
        '400': { description: New password shorter than 8 characters }
        '403': { description: Current password wrong }
  /api/auth/check:
    get:
      summary: Validate the session cookie or bearer token
      description: Returns 200 when the request is signed in (cookie or token), 401 otherwise.
      tags: [Auth]
      responses:
        '200':
          description: Token accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  authenticated: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/config/netplan-preview:
    post:
      summary: Render the Netplan YAML for a static address
      tags: [Configuration]
      requestBody:
        $ref: '#/components/requestBodies/NetplanChange'
      responses:
        '200':
          description: Rendered YAML and the address it configures

  /api/config/netplan-apply:
    post:
      summary: Apply a static IP with an armed revert timer
      description: >
        Backs up the current Netplan files, runs `netplan generate` and `netplan apply`, and arms
        a transient systemd timer (default 120 s) that restores the backup unless
        /api/config/netplan-confirm is called first. Runs through the privileged netplan_cli helper.
      tags: [Configuration]
      requestBody:
        $ref: '#/components/requestBodies/NetplanChange'
      responses:
        '200':
          description: Change applied; revert timer pending
        '500':
          description: Validation or apply failed; nothing changed

  /api/config/netplan-confirm:
    post:
      summary: Keep the pending static IP change
      description: Cancels the revert timer and deletes the backup. Call it from the new address.
      tags: [Configuration]
      responses:
        '200':
          description: Change confirmed or nothing was pending

  /api/config/netplan-status:
    get:
      summary: Is a static IP change awaiting confirmation?
      tags: [Configuration]
      responses:
        '200':
          description: Pending state and seconds left on the revert timer

  /api/alerts:
    get:
      summary: Alert settings, open alerts and recent history
      description: >
        Channels (ntfy, Telegram, Discord, email; secrets returned as "********"), rules with
        their thresholds, quiet hours, the daily summary, alerts open now, the last 30 sent or
        held alerts, each channel's last delivery result and whether quiet hours are on now.
      tags: [Alerts]
      responses:
        '200':
          description: Alert overview

  /api/alerts/config:
    put:
      summary: Save alert channels, rules and quiet hours
      description: >
        Partial update. A secret sent back as "********" keeps the stored value. Unknown keys
        are ignored. Stored 0600 in the Control Hub state directory (ALERTS_CONFIG_FILE).
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels: { type: object }
                rules: { type: object }
                quiet_hours:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    start: { type: string, example: "23:00" }
                    end: { type: string, example: "07:00" }
                daily_summary:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    time: { type: string, example: "08:00" }
      responses:
        '200':
          description: Saved; same body as GET /api/alerts
        '400':
          description: A value was invalid (for example an ntfy topic shorter than 12 characters)

  /api/alerts/test:
    post:
      summary: Send a test message to one channel
      description: Uses the stored settings with any unsaved values from the request applied on top; nothing is saved.
      tags: [Alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [ntfy, telegram, discord, email] }
                channels: { type: object }
      responses:
        '200':
          description: "{channel, ok, error}"
        '400':
          description: Unknown channel or invalid value

  /api/alerts/check:
    post:
      summary: Check every rule now
      description: Runs the same evaluation the background thread runs every minute and returns the overview plus `sent_now`.
      tags: [Alerts]
      responses:
        '200':
          description: Overview with the alerts sent by this check

  /api/indexers/status:
    get:
      summary: Indexer picker state
      description: >
        Whether the media module is installed (a Prowlarr API key exists), whether Prowlarr is
        reachable and how many indexers are configured. The dashboard shows a one-time banner
        while the count is zero.
      tags: [Indexers]
      responses:
        '200':
          description: installed / reachable / configured count
        '404':
          description: Media module not installed

  /api/indexers/available:
    get:
      summary: Prowlarr's own indexer definition list
      description: >
        Fetched live from the user's Prowlarr (`indexer/schema`): name, protocol, privacy and the
        credential fields private trackers need. The repository ships no tracker list and nothing
        is pre-selected.
      tags: [Indexers]
      responses:
        '200':
          description: Definitions with count
        '502':
          description: Prowlarr did not answer

  /api/indexers/add:
    post:
      summary: Add indexers chosen from the list
      description: >
        Adds up to 50 definitions by name through Prowlarr's API, filling any credential fields
        given. Prowlarr's connection test runs on save unless `force` is true.
      tags: [Indexers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indexers]
              properties:
                indexers:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, example: "1337x" }
                      fields:
                        type: object
                        additionalProperties: true
                        description: Credential fields for private trackers, keyed by Prowlarr field name
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Per-indexer results
        '400':
          description: Malformed body

  /api/updates:
    get:
      summary: Container and Blueprint release updates
      description: Compares running pinned Docker container tags and Control Hub against cached upstream GitHub releases.
      tags: [Services]
      responses:
        '200':
          description: "{checked_at, checked_at_str, pending, majors, rows}"

  /api/updates/check:
    post:
      summary: Force an upstream GitHub release check
      description: Refreshes release versions from GitHub if at least 10 minutes have elapsed since the previous check.
      tags: [Services]
      responses:
        '200':
          description: Updated release comparison with `throttled` flag

  /api/updates/apply:
    post:
      summary: Apply one or all safe app updates with backup and automatic rollback
      description: Invokes /usr/local/sbin/homelab-update in a background job; returns 404 when the blueprint helper is absent or 400 for manual major upgrades.
      tags: [Services]
      responses:
        '202':
          description: Background update job started
        '400':
          description: Manual migration required or invalid target
        '404':
          description: Blueprint update helper not installed

  /api/updates/self-update:
    post:
      summary: Self-update Control Hub and Blueprint release checkout
      description: Checks out the release tag and re-applies installer config via homelab-update (hidden in standalone mode).
      tags: [Services]
      responses:
        '202':
          description: Self-update job started

  /api/updates/policy:
    post:
      summary: Toggle automatic patch-only updates
      description: Saves auto-patch policy (`auto_patch` boolean; majors and minors are never auto-applied).
      tags: [Services]
      responses:
        '200':
          description: Updated policy state

  /api/updates/job:
    get:
      summary: Poll running or last update job status
      tags: [Services]
      responses:
        '200':
          description: "{running, kind, target, ok, rolled_back, message, results}"

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Contents of /etc/homelab/control-hub.token (or CONTROL_HUB_TOKEN when run standalone)
  responses:
    Unauthorized:
      description: Missing or wrong bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: error }
              error: { type: string, example: unauthorized }
              hint: { type: string }
  requestBodies:
    NetplanChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [interface, ip]
            properties:
              interface: { type: string, example: enp3s0 }
              ip: { type: string, example: 192.168.1.50/24 }
              gateway: { type: string, example: 192.168.1.1 }
              dns:
                type: array
                items: { type: string }
                example: ["1.1.1.1", "8.8.8.8"]
              timeout: { type: integer, default: 120, description: Seconds before the automatic revert }
